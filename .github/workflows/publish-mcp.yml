name: Publish to MCP Registry

on:
  push:
    branches: ["main"]
    paths: ["server.json", ".github/workflows/publish-mcp.yml"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Validate
        run: ./mcp-publisher validate server.json
      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish server.json
      - name: Verify
        run: sleep 5 && curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=vlada" | head -c 800
